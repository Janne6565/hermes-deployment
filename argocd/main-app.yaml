# Registered in cluster-deployment/apps/hermes.yaml (with the matching AppProject in
# cluster-deployment/projects/hermes.yaml) — `root` there is what actually applies it.
# This copy is kept in sync as the canonical definition.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hermes
  source:
    repoURL: https://github.com/Janne6565/hermes-deployment
    targetRevision: main
    path: overlays/main
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    # Fully automated: any commit to main (CI tag bump or manual manifest edit) reconciles onto
    # the cluster with no manual step.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
