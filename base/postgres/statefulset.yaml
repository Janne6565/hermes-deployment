apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-postgres
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: postgres
spec:
  serviceName: hermes-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: hermes
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hermes-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-db
                  key: password
            # The default mount point is the volume root, which on a PVC contains lost+found and
            # makes initdb refuse to run. A subdirectory avoids that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hermes", "-d", "hermes"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          # Included in the cluster's existing Velero regime.
          backup.velero.io/backup-volumes: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
