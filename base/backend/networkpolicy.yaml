# Defence in depth for the sidecar.
#
# The sidecar already binds to 127.0.0.1, so nothing off-pod can reach it regardless. This policy
# makes the intent explicit at the cluster layer: the only ingress the backend pod accepts is
# HTTP/8080 from Traefik and from other pods in the namespace. Traffic between containers in the
# same pod never traverses the CNI, so intra-pod calls to 8081 are unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-backend
  labels:
    app.kubernetes.io/name: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
