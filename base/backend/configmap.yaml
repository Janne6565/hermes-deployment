apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  labels:
    app.kubernetes.io/name: hermes
data:
  HERMES_TIMEZONE: "Europe/Berlin"
  # Phase 3 default. Flip to "false" only after reviewing the shadow-mode classifications —
  # this is the switch that lets the service interrupt you.
  HERMES_SHADOW_MODE: "true"
  # Must match a redirect URI registered on the Google OAuth client, character for character.
  GMAIL_REDIRECT_URI: "https://hermes.jannekeipert.de/api/v1/auth/google/callback"
  GMAIL_POST_CONNECT_REDIRECT: "/settings?connected=1"
  SIDECAR_URL: "http://127.0.0.1:8081"
  # Rules-only until a real claude-oauth-token is sealed. With a placeholder token the sidecar
  # starts but every classification would burn the full 30s timeout before failing, stalling the
  # poll loop; disabling it here skips the call entirely. This is exactly the plan's phase 1.
  SIDECAR_ENABLED: "false"
  NTFY_URL: "https://ntfy.jannekeipert.de"
  NTFY_TOPIC: "janus-mail"
  DIGEST_SEND_TIME: "18:00"
  RETENTION_DAYS: "90"
  QUIET_HOURS_ENABLED: "false"
  LOG_LEVEL: "INFO"
