apiVersion: v1
kind: Service
metadata:
  name: hermes-backend
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
  # Note there is no port for the sidecar (8081) and there must never be one — it holds an
  # account-level Claude credential and binds to loopback.
