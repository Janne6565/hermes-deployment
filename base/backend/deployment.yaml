apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-backend
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: backend
  annotations:
    # Restart on secret/configmap change instead of waiting for the next unrelated rollout.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # The Gmail poll loop and the digest cron are singletons — two replicas would double-push.
  # Recreate rather than RollingUpdate so there is never a moment with two of them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        # ---------------------------------------------------------------------------------
        # triage-api — Gmail sync, rules, digest, ntfy, webhook intake, the REST API.
        # ---------------------------------------------------------------------------------
        - name: triage-api
          image: ghcr.io/janne6565/hermes-backend
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hermes-config
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://hermes-postgres:5432/hermes
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: hermes-db
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-db
                  key: password
            - name: GMAIL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gmail-oauth
                  key: client-id
            - name: GMAIL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gmail-oauth
                  key: client-secret
            # No GMAIL_REFRESH_TOKEN here: the account is attached in-app through Sign in with
            # Google and the token is stored encrypted in Postgres. The property still exists as a
            # bootstrap escape hatch, but wiring it to a secret key that normally doesn't exist
            # would just stop the pod from starting.
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ntfy-credentials
                  key: token
            - name: ALERT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: alert-webhook-secret
                  key: token
            # Protects the Google refresh token at rest. Changing it forces a re-connect.
            - name: HERMES_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-app-key
                  key: encryption-key
            # Single-user gate on /api. Without it the public ingress exposes your mail.
            - name: HERMES_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-app-key
                  key: admin-token
          startupProbe:
            # Flyway plus JPA validation on a cold database takes a while; give it room rather
            # than letting the liveness probe kill a healthy but slow start.
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp

        # ---------------------------------------------------------------------------------
        # claude-sidecar — classification. Holds an account-level Claude credential, binds to
        # loopback, and has no Service and no Ingress. It is reachable only from triage-api,
        # over the pod's shared network namespace.
        # ---------------------------------------------------------------------------------
        - name: claude-sidecar
          image: ghcr.io/janne6565/hermes-sidecar
          # Deliberately no `ports:` entry — declaring one would not open it up, but its absence
          # documents that nothing is meant to reach this container from outside the pod.
          env:
            - name: SIDECAR_HOST
              value: "127.0.0.1"
            - name: SIDECAR_PORT
              value: "8081"
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-oauth-token
                  key: token
          # No liveness probe on purpose. /health reports 503 while the classifier is degraded
          # (credit exhausted, rate limited) — a state the backend already handles by falling back
          # to rules-only. Probing it would restart the pod on every degradation, turning a
          # recoverable condition into an outage and taking triage-api down with it. Degradation
          # is surfaced through the backend's /api/v1/health and the digest instead.
          resources:
            # I/O bound: it waits on the API, it does not compute.
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sidecar-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: sidecar-tmp
          emptyDir: {}
