apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single environment. Everything lives in the `hermes` namespace.
namespace: hermes
resources:
  - ../../base
  - authentik.yaml
  - ingress.yaml
# CI (backend / sidecar / frontend repos) rewrites these tags and pushes; ArgoCD then auto-syncs.
# The values below are placeholders until the first CI run publishes an image.
images:
  - name: ghcr.io/janne6565/hermes-backend
    newName: ghcr.io/janne6565/hermes-backend
    newTag: main-3c266ee
  - name: ghcr.io/janne6565/hermes-sidecar
    newName: ghcr.io/janne6565/hermes-sidecar
    newTag: main-9c3e443
  - name: ghcr.io/janne6565/hermes-frontend
    newName: ghcr.io/janne6565/hermes-frontend
    newTag: main-46a6825
