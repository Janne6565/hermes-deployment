# Authentik forward auth — the thing that actually keeps hermes.jannekeipert.de private.
#
# Every request to the protected router is held at Traefik while it asks Authentik's
# embedded outpost whether this browser has a session. Unauthenticated requests never
# reach a Hermes pod at all: they get a 302 to sso.jannekeipert.de. The Authentik-side
# provider, application and the hermes-users group gate live in
# cluster-deployment/infrastructure/authentik-hermes-blueprint.yaml.
#
# Only the Middleware lives here; it is attached to the protected router by the
# `traefik.ingress.kubernetes.io/router.middlewares` annotation in ingress.yaml.
#
# The outpost's own callback path (/outpost.goauthentik.io) is NOT routed from this
# repo. It is published from the authentik namespace, in
# cluster-deployment/infrastructure/authentik-outpost-ingress.yaml — routing it from
# here would need an ExternalName Service, which Traefik refuses by default and then
# silently drops the router, so the path falls through to the SPA's own 404 page.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  labels:
    app.kubernetes.io/name: hermes
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    # The outpost has to see the original host and scheme to build the right redirect
    # back to hermes.jannekeipert.de after login.
    trustForwardHeader: true
    # Traefik copies exactly these from the outpost's response onto the request —
    # overwriting anything the client sent under the same names, which is why the
    # backend is allowed to treat X-authentik-username as proof on this router.
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
